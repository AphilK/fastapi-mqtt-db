services:

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  sensors:
    build:
      context: .
      dockerfile: SensorsDockerfile
    container_name: sensors
    env_file: ".env"
    develop:
      watch:
        - action: rebuild
          path: .
    restart: no
    depends_on:
      - influxdb3-core
    volumes:
      - .:/sensors

  fastapi:
    build: 
      context: .
      dockerfile: FastapiDockerfile
    container_name: fastapi
    env_file: ".env"
    develop:
      watch:
        - action: rebuild
          path: .
    restart: no
    depends_on:
      - influxdb3-core
    volumes:
      - .:/app

  influxdb3-core:
    container_name: influxdb3-core
    image: influxdb:3-core
    ports:
      - 8181:8181
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --admin-token-file=/run/secrets/admin-token
    secrets:
      - admin-token
    volumes:
      - type: bind
        source: ./.influxdb3/data
        target: /var/lib/influxdb3/data
      - type: bind
        source: ./.influxdb3/plugins
        target: /var/lib/influxdb3/plugins

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: unless-stopped
    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    depends_on:
      - influxdb3-core
      - mosquitto
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro

secrets:
  admin-token:
    file: admin-token.json